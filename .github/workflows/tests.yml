name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --group dev --frozen

      - name: Ruff lint
        run: .venv/bin/ruff check custom_components tests

      - name: Ruff format check
        run: .venv/bin/ruff format --check custom_components tests

  unit:
    name: Unit tests (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deps: [locked, latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (locked)
        if: matrix.deps == 'locked'
        run: uv sync --group dev --frozen

      - name: Install dependencies (latest HA)
        if: matrix.deps == 'latest'
        run: >-
          uv sync --group dev
          --upgrade-package homeassistant
          --upgrade-package pytest-homeassistant-custom-component

      - name: Run unit tests
        run: .venv/bin/pytest tests/ --ignore=tests/test_live.py -v
