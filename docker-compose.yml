services:
  homeassistant:
    container_name: ha-solarman-dev
    image: homeassistant/home-assistant:stable
    restart: "no"
    stop_grace_period: 30s
    ports:
      - "8123:8123"
    volumes:
      - ./ha-config:/config
      - ./custom_components:/config/custom_components
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Warsaw
