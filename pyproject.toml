[project]
name = "ha-solarman-api"
version = "0.0.1"
description = "Home Assistant custom integration for the Solarman API"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "homeassistant",
  "aiohttp>=3.13.5",
  "pytest",
  "pytest-asyncio",
  "pytest-homeassistant-custom-component",
  "aioresponses",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
